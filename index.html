<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="OIO Dash 2.0 — corra, salte e colete moedas.">
  <title>OIO Dash 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="hud" aria-label="Placar">
      <div><span>PONTOS</span><strong id="score">0</strong></div>
      <div class="brand">OIO <b>DASH</b></div>
      <div><span>MOEDAS</span><strong id="coins">0</strong></div>
      <div><span>RECORDE</span><strong id="best">0</strong></div>
    </header>

    <section id="arena" class="arena" aria-label="Área do jogo">
      <div class="stars stars-a"></div>
      <div class="stars stars-b"></div>
      <div class="horizon"></div>
      <div class="sky-glow"></div>
      <div class="player-shadow" aria-hidden="true"></div>
      <img id="player" class="player" src="assets/dash-run.webp" alt="Dash correndo">
      <div id="player-hitbox" class="player-hitbox" aria-hidden="true"></div>
      <div id="message" class="message">
        <div class="message-card">
          <span class="eyebrow">OIO GAME LAB</span>
          <h1>OIO <b>DASH</b></h1>
          <p>Salte os obstáculos e pegue as moedas.</p>
          <button id="start">JOGAR</button>
        </div>
      </div>
      <div class="ground">
        <div class="ground-line"></div>
      </div>
    </section>

    <button id="jump" class="jump">SALTAR</button>
    <p class="tip">Toque na arena ou no botão. Espaço e ↑ também funcionam.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
